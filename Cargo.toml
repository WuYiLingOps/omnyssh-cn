[workspace]
resolver = "2"
members = ["crates/omnyssh-core", "crates/omnyssh", "crates/omnyssh-gui"]
# GUI excluded from bare cargo builds: `cargo build`/`test`/`install` at the root
# build core + TUI only, with no Tauri/npm toolchain (tech-gui.md §3.1).
default-members = ["crates/omnyssh-core", "crates/omnyssh"]

[workspace.package]
version = "1.1.6"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/timhartmann7/omnyssh"

[workspace.dependencies]
# Async runtime — explicit features only; avoids pulling in unused tokio subsystems.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "process", "fs", "io-util"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
dirs = "5"
chrono = "0.4"

# Secret store (core::secrets): system keychain with an encrypted-file fallback.
# `sync-secret-service` needs libdbus at link time, which a static musl build
# cannot provide (no pkg-config module, no vendored crate) — musl targets are
# excluded there via `cfg` in omnyssh-core and run on the file backend.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
machine-uid = "0.5"
aes-gcm = "0.10"
base64 = "0.22"
serde_json = "1"
# Keychain key-entry / identity ids (identities.toml)
uuid = { version = "1", features = ["v4"] }
# Re-encrypting a stored PEM on a passphrase change (ssh-key's `encrypt` rng)
getrandom = { version = "0.4", features = ["sys_rng"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Keep debug targets small on Windows, where MSVC writes debug info to a
# sidecar .pdb that dwarfs the binary itself (a 30 MB test exe used to carry a
# ~280 MB pdb). Line tables keep panic backtraces pointing at real files and
# lines; full variable inspection stays available for our own crates, while
# dependencies (the bulk of the symbol volume) ship without any debug info.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
# Test binaries rebuild with fresh fingerprints every run, so their incremental
# caches were never reused — each `cargo test` used to leave half a GB of
# session data behind that cargo never collects. Incremental brings nothing to
# a build-once-run-once target; dev builds keep it.
[profile.test]
incremental = false
